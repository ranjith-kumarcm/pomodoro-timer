<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Pomodoro Timer</h1>
    </header>

    <main class="container">
        <!-- Timer Display Section -->
        <section class="timer-section" aria-labelledby="session-status">
            <h2 id="session-status">Work Session</h2>
            
            <div class="progress-wrapper">
                <div id="progress-bar" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <div id="time-display" class="time">25:00</div>
            
            <div class="controls">
                <button id="start-btn">Start</button>
                <button id="pause-btn" disabled>Pause</button>
                <button id="reset-btn">Reset</button>
            </div>
        </section>

        <!-- Settings Form Section -->
        <section class="settings-section">
            <h2>Settings</h2>
            <form id="settings-form" novalidate>
                <div class="form-group">
                    <label for="work-duration">Work Duration (min):</label>
                    <input type="number" id="work-duration" value="25" min="1" max="120" required>
                </div>
                <div class="form-group">
                    <label for="break-duration">Break Duration (min):</label>
                    <input type="number" id="break-duration" value="5" min="1" max="60" required>
                </div>
                <div class="form-group">
                    <label for="preset-select">Quick Presets:</label>
                    <select id="preset-select">
                        <option value="custom">Custom</option>
                        <option value="25,5">Standard (25/5)</option>
                        <option value="50,10">Long (50/10)</option>
                    </select>
                </div>
                <button type="submit" id="save-btn">Save Settings</button>
                <div id="error-message" class="error hidden" aria-live="polite">Please enter valid positive numbers.</div>
            </form>
        </section>

        <!-- Tracking Section -->
        <section class="tracking-section">
            <div class="stats">
                <h3>Sessions Completed: <span id="session-count">0</span></h3>
            </div>
            <ul id="history-list"></ul>
            <button id="clear-history" class="secondary-btn">Clear History</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
